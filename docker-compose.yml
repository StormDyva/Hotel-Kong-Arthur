services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_kong_arthur}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change_me_locally}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      APP_DATABASE_USER: ${POSTGRES_USER:-hotel_app}
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_kong_arthur}
    volumes:
      - ./database/postgres/migrations:/migrations:ro
      - ./database/postgres/seed:/seed:ro
      - ./database/postgres/tests:/tests:ro
      - ./database/postgres/apply-database.sh:/scripts/apply-database.sh:ro
    command: ["/bin/sh", "/scripts/apply-database.sh"]

  demo-init:
    build:
      context: ./backend
      target: runtime
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hotel_kong_arthur}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    volumes:
      - ./database:/project/database:ro
    command: ["python", "/project/database/import/load_demo_data.py"]

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      demo-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5500},http://127.0.0.1:${FRONTEND_PORT:-5500}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hotel_kong_arthur}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel_kong_arthur_test
      POSTGRES_USER: hotel_test
      POSTGRES_PASSWORD: test_password
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

  test-runner:
    profiles: ["test"]
    image: postgres:17-alpine
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_USER: hotel_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: hotel_kong_arthur_test
      RUN_CHECKS: "1"
      RESET_TEST_DATABASE: "1"
    volumes:
      - ./database/postgres/migrations:/migrations:ro
      - ./database/postgres/seed:/seed:ro
      - ./database/postgres/tests:/tests:ro
      - ./database/postgres/apply-database.sh:/scripts/apply-database.sh:ro
    command: ["/bin/sh", "/scripts/apply-database.sh"]

  api-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    depends_on:
      test-runner:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hotel_kong_arthur_test
      POSTGRES_USER: hotel_test
      POSTGRES_PASSWORD: test_password
    volumes:
      - ./openapi:/openapi:ro
      - ./tableau:/tableau:ro
      - ./database:/project/database:ro

volumes:
  postgres_data:
