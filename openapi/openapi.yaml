        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Page Size
      - name: room_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Room Id
      - name: guest_id
        in: query
        required: false
