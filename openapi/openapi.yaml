      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 9998
            minimum: 1900
          - type: 'null'
          title: Year
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryRevenueRow'
                title: Response Country Revenue Rows Analytics Revenue By Country
                  Get
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Booking conflict or operation not eligible
          content:
            application/json:
