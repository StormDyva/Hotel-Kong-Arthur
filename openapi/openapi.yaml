openapi: 3.1.0
info:
  title: Hotel Kong Arthur API
  description: Three-layer REST API backed by MySQL. Dates use [from,to), checkout
    is exclusive. Money is DKK. Existing /api responses use decimal strings; flat
    /analytics/revenue exports use JSON numbers. Analytics default to calendar 2026.
    Hotel filters do not filter bar sales. Demo inventory is synthetic.
  version: 1.1.0
paths:
  /health:
    get:
      tags:
      - System
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Booking conflict or operation not eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
